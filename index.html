<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LONGXUYEN FC</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a2a0a;
  font-family: 'Be Vietnam Pro', sans-serif;
  color: #fff;
  padding: 16px;
  min-height: 100vh;
}

.wrap { max-width: 640px; margin: 0 auto; }

/* ── Nav ── */
.nav {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  width: 100%;
  flex-wrap: wrap;
}
.nav-btn {
  font-family: 'Be Vietnam Pro', sans-serif;
  font-size: 12px; font-weight: 600;
  padding: 6px 16px; border-radius: 20px; cursor: pointer;
  border: 1.5px solid rgba(255,255,255,0.2);
  background: transparent; color: rgba(255,255,255,0.5);
  text-decoration: none; transition: all 0.15s;
  letter-spacing: 0.3px;
  white-space: nowrap;
  display: inline-block;
}
.nav-btn:hover { border-color: rgba(255,215,0,0.5); color: rgba(255,255,255,0.85); }
.nav-btn.active {
  background: rgba(255,215,0,0.15);
  border-color: #FFD700; color: #FFD700;
}

/* ── Header ── */
.header { text-align: center; margin-bottom: 16px; }
.header h1 {
  font-family: 'Oswald', sans-serif;
  font-size: 30px; font-weight: 700;
  color: #FFD700; letter-spacing: 3px;
}
.header .meta {
  color: rgba(255,255,255,0.45);
  font-size: 11px; letter-spacing: 1px;
  text-transform: uppercase; margin-top: 4px;
}

/* ── Birthday banner ── */
.bday-banner {
  display: none;
  background: linear-gradient(135deg, rgba(255,215,0,0.16), rgba(255,215,0,0.05));
  border: 1px solid rgba(255,215,0,0.4);
  border-radius: 12px; padding: 12px 16px;
  margin-bottom: 14px; text-align: center;
  font-size: 13px; line-height: 1.5;
}
.bday-banner strong { color: #FFD700; }
.bday-title { font-weight: 700; color: #FFD700; margin-bottom: 6px; }
.bday-list { display: flex; flex-direction: column; gap: 3px; }
.bday-item { color: rgba(255,255,255,0.75); }
.bday-item.is-today { color: #fff; font-weight: 600; }

/* ── Card ── */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.card-title {
  font-family: 'Oswald', sans-serif;
  font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.45);
  letter-spacing: 1.5px; text-transform: uppercase;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}

/* ── Loading ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  height: 100px; color: rgba(255,255,255,0.3); font-size: 13px; gap: 8px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.15);
  border-top-color: #FFD700; border-radius: 50%;
  animation: spin 0.8s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Next match ── */
.countdown-badge {
  display: inline-block; background: rgba(255,215,0,0.15);
  border: 1px solid rgba(255,215,0,0.4); color: #FFD700;
  font-size: 11px; font-weight: 700; padding: 3px 10px;
  border-radius: 12px; margin-bottom: 10px;
}
.next-match-card { text-align: center; }
.match-vs { font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 700; color: #fff; }
.match-detail { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 6px; line-height: 1.7; }
.match-detail .row-item { display: flex; align-items: center; justify-content: center; gap: 6px; }
.match-going {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; align-items: center; justify-content: center;
}
.match-going .val { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; color: #4caf50; }
.match-going .lbl { color: rgba(255,255,255,0.4); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.no-match { text-align: center; padding: 20px 0; color: rgba(255,255,255,0.35); font-size: 12px; }

.match-extra {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex; flex-direction: column; gap: 6px;
  font-size: 11.5px; color: rgba(255,255,255,0.6); line-height: 1.6;
}
.live-badge { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
.live-badge.on  { color: #f44336; font-weight: 600; }
.live-badge.off { color: rgba(255,255,255,0.35); }
.h2h-line { color: #FFD700; font-weight: 600; }
.hauCan-box {
  margin-top: 10px; text-align: left; background: rgba(255,255,255,0.03);
  border-radius: 8px; padding: 10px 12px; font-size: 11.5px;
  color: rgba(255,255,255,0.7); white-space: pre-line; line-height: 1.65;
}
.hauCan-box .title {
  display: block; font-weight: 700; color: rgba(255,255,255,0.45);
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
}

/* ── Attendance ── */
.att-group { border-radius: 8px; margin-bottom: 6px; overflow: hidden; background: rgba(255,255,255,0.03); }
.att-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; cursor: pointer; user-select: none;
}
.att-head .lbl { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
.att-count { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; }
.att-caret { color: rgba(255,255,255,0.3); font-size: 10px; transition: transform 0.15s; }
.att-group.open .att-caret { transform: rotate(90deg); }
.att-names {
  display: none; padding: 0 12px 10px 34px;
  flex-wrap: wrap; gap: 6px;
}
.att-group.open .att-names { display: flex; }
.att-chip {
  background: rgba(255,255,255,0.06); border-radius: 10px;
  padding: 3px 9px; font-size: 11px; color: rgba(255,255,255,0.75);
}
.dot-go     { color: #4caf50; }
.dot-busy   { color: #f44336; }
.dot-maybe  { color: #ff9800; }
.dot-none   { color: rgba(255,255,255,0.35); }

.lineup-link {
  display: block; text-align: center; margin-top: 10px;
  font-size: 12px; color: #FFD700; text-decoration: none;
  padding: 8px; border-radius: 8px; border: 1px dashed rgba(255,215,0,0.35);
}
.lineup-link:hover { background: rgba(255,215,0,0.06); }

/* ── Lineup card: pitch view (sơ đồ 4-1-4-1) ── */
.pitch-note {
  font-size: 11px; color: rgba(255,255,255,0.4);
  margin-bottom: 12px; line-height: 1.5; text-align: center;
}
.pitch-field {
  background: #1e7a1e; border-radius: 10px;
  border: 2px solid rgba(255,255,255,0.15);
  position: relative; padding: 10px 4px;
  display: flex; flex-direction: column; gap: 2px;
  overflow: hidden;
}
.pitch-field::before {
  content: ''; position: absolute; top: 50%; left: 6%; right: 6%;
  height: 1px; background: rgba(255,255,255,0.18);
}
.pitch-field::after {
  content: ''; position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 54px; height: 54px;
  border: 1.5px solid rgba(255,255,255,0.18); border-radius: 50%;
}
.pitch-goal { width: 44px; height: 10px; flex-shrink: 0; }
.pitch-goal.top { margin: 0 auto 4px; border: 2px solid rgba(255,255,255,0.35); border-top: none; border-radius: 0 0 4px 4px; }
.pitch-goal.bot { margin: 4px auto 0; border: 2px solid rgba(255,255,255,0.35); border-bottom: none; border-radius: 4px 4px 0 0; }
.pitch-row { display: flex; justify-content: center; align-items: flex-start; gap: 4px; position: relative; z-index: 1; padding: 3px 0; }
.pitch-player { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 60px; }
.pitch-avatar {
  width: 38px; height: 38px; border-radius: 50%; overflow: hidden;
  border: 2px solid rgba(255,255,255,0.5); background: #145214;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.pitch-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pitch-avatar .ini { font-size: 9px; font-weight: 700; color: #fff; }
.pitch-player.gk  .pitch-avatar { border-color: #FFD700; }
.pitch-player.def .pitch-avatar { border-color: #5b9fe8; }
.pitch-player.mid .pitch-avatar { border-color: #c97de8; }
.pitch-player.fwd .pitch-avatar { border-color: #e87070; }
.pitch-name { color: #fff; font-size: 9px; font-weight: 700; text-align: center; line-height: 1.2; text-shadow: 0 1px 3px rgba(0,0,0,0.9); word-break: break-word; }
.pitch-pos { color: rgba(255,255,255,0.5); font-size: 8px; text-align: center; }
.pitch-player.empty .pitch-avatar { border-style: dashed; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.03); }
.pitch-player.empty .pitch-name { color: rgba(255,255,255,0.3); font-weight: 600; }

.reserve-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 8px; }
.reserve-list { display: flex; flex-wrap: wrap; gap: 6px; }
.reserve-chip {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.05); border-radius: 16px;
  padding: 4px 10px 4px 4px; font-size: 11px; color: rgba(255,255,255,0.8);
}
.reserve-avatar {
  width: 20px; height: 20px; border-radius: 50%; overflow: hidden;
  background: #145214; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.reserve-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reserve-avatar .ini { font-size: 7px; font-weight: 700; color: #fff; }
.lineup-empty { text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; padding: 10px 0; }

/* ── Lịch thi đấu mùa giải ── */
.sched-list { display: flex; flex-direction: column; gap: 8px; }
.sched-item {
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px;
}
.sched-item.off { opacity: 0.6; }
.sched-date {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  width: 42px; flex-shrink: 0; line-height: 1.2;
}
.sched-date .d { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; color: #FFD700; }
.sched-date .m { font-size: 9px; color: rgba(255,255,255,0.4); text-transform: uppercase; }
.sched-info { flex: 1; min-width: 0; }
.sched-title { font-size: 12.5px; font-weight: 600; color: #fff; }
.sched-sub { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.sched-live { font-size: 10px; font-weight: 700; color: #f44336; flex-shrink: 0; white-space: nowrap; }
.sched-more-link {
  display: block; text-align: center; margin-top: 10px;
  font-size: 12px; color: #FFD700; text-decoration: none;
  padding: 8px; border-radius: 8px; border: 1px dashed rgba(255,215,0,0.35);
}
.sched-more-link:hover { background: rgba(255,215,0,0.06); }

/* ── Activity feed ── */
.feed-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06);
}
.feed-item:first-child { border-top: none; }
.feed-badge {
  width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 700;
}
.feed-badge.W { background: #4caf50; }
.feed-badge.D { background: #ff9800; }
.feed-badge.L { background: #f44336; }
.feed-badge.thu { background: rgba(76,175,80,0.18); color: #4caf50; font-size: 14px; }
.feed-badge.chi { background: rgba(244,67,54,0.18); color: #f44336; font-size: 14px; }
.feed-text { flex: 1; min-width: 0; }
.feed-title { font-size: 12.5px; font-weight: 600; color: #fff; }
.feed-sub { font-size: 10.5px; color: rgba(255,255,255,0.4); margin-top: 2px; }
.feed-amount { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.feed-amount.pos { color: #4caf50; }
.feed-amount.neg { color: #f44336; }
.empty-note { text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; padding: 10px 0; }

/* ── Footer ── */
.updated { text-align: center; margin-top: 6px; color: rgba(255,255,255,0.2); font-size: 10px; }

@media (max-width: 600px) {
  body { padding: 10px 8px; }
  .header h1 { font-size: 24px; }
}
</style>
</head>

    <div class="meta" id="team-meta">Đang tải...</div>
  </div>

  <div class="bday-banner" id="bday-banner"></div>

  <div id="content">
    <div class="card"><div class="loading"><div class="spinner"></div> Đang tải dữ liệu...</div></div>
  </div>

  <div class="updated" id="updated"></div>

</div>

<script>
const STATUS_META = {
  "Tham gia":      { icon: "✓", dot: "dot-go" },
  "Bận":           { icon: "✕", dot: "dot-busy" },
  "Chưa chắc":     { icon: "?", dot: "dot-maybe" },
  "Chưa trả lời":  { icon: "…", dot: "dot-none" }
};
const STATUS_ORDER = ["Tham gia", "Bận", "Chưa chắc", "Chưa trả lời"];
const WEEKDAY = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];

const POS_LABEL = {
  "Thủ môn": "Thủ Môn", "Trung vệ": "Trung Vệ", "Hậu vệ cánh": "HV Cánh",
  "Tiền vệ TT": "TV Trung Tâm", "Tiền vệ cánh": "TV Cánh", "Tiền đạo": "Tiền Đạo"
};

function fmt(n) { return Number(n).toLocaleString('vi-VN'); }
function posClass(v) {
  if (v === "Thủ môn") return "gk";
  if (v && (v.includes("Hậu") || v.includes("Trung"))) return "def";
  if (v && v.includes("Tiền vệ")) return "mid";
  if (v && v.includes("Tiền đạo")) return "fwd";
  return "mid";
}
function posLabel(v) { return POS_LABEL[v] || v || ''; }
function initials(name) { return String(name || '').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 3); }
function faceUrl(url, size) {
  size = size || 100;
  if (!url) return '';
  if (url.includes('res.cloudinary.com') && url.includes('/upload/')) {
    return url.replace('/upload/', `/upload/c_fill,g_face,w_${size},h_${size}/`);
  }
  return url;
}

function renderNextMatchCard(d) {
  const m = d.nextMatch;
  if (!m) {
    return `
      <div class="card">
        <div class="card-title">🗓️ Trận sắp tới</div>
        <div class="no-match">Chưa có lịch trận sắp tới.<br>Vào Google Sheet ▸ menu ⚽ Quản lý đội bóng ▸ 📅 Nhập trận sắp tới để cập nhật.</div>
      </div>`;
  }

  const matchDateTime = new Date(m.ngay + 'T' + (m.gio || '00:00'));
  const now = new Date();
  const diffMs = matchDateTime - now;
  const diffDays = Math.ceil(diffMs / (1000*60*60*24));
  let countdownText;
  if (isNaN(matchDateTime.getTime())) countdownText = '';
  else if (diffMs < 0) countdownText = 'Đã diễn ra';
  else if (diffDays <= 0) countdownText = 'Hôm nay';
  else if (diffDays === 1) countdownText = 'Còn 1 ngày';
  else countdownText = `Còn ${diffDays} ngày`;

  const wd = isNaN(matchDateTime.getTime()) ? '' : WEEKDAY[matchDateTime.getDay()];
  const dateLabel = isNaN(matchDateTime.getTime()) ? '' :
    `${wd} ${String(matchDateTime.getDate()).padStart(2,'0')}/${String(matchDateTime.getMonth()+1).padStart(2,'0')}`;

  const att = d.attendance || {};
  const diCount = (att["Tham gia"] || []).length;
  const total = d.memberCount || 0;

  const h2h = d.headToHead;
  const h2hLine = h2h
    ? `<div class="row-item h2h-line">🆚 Đối đầu: ${h2h.total} trận · ${h2h.w}T-${h2h.d}H-${h2h.l}B (${h2h.gf}-${h2h.ga} bàn)</div>`
    : '';

  const liveLine = m.liveStream
    ? `<div class="row-item live-badge on">🔴 Livestream${m.donViLive ? ' · ' + m.donViLive : ''}</div>`
    : `<div class="row-item live-badge off">📡 Không livestream</div>`;

  const meetLine = (m.gioHopMat || m.diaDiemCafe)
    ? `<div class="row-item">☕ Họp mặt${m.gioHopMat ? ' ' + m.gioHopMat : ''}${m.diaDiemCafe ? ' tại ' + m.diaDiemCafe : ''}</div>`
    : '';

  const hauCanBox = m.ghiChuHauCan
    ? `<div class="hauCan-box"><span class="title">📋 Công tác hậu cần</span>${m.ghiChuHauCan}</div>`
    : '';

  return `
    <div class="card next-match-card">
      <div class="card-title">🗓️ Trận sắp tới</div>
      ${countdownText ? `<div class="countdown-badge">${countdownText}</div>` : ''}
      <div class="match-vs">vs ${m.doiThu || 'Chưa rõ đối thủ'}</div>
      <div class="match-detail">
        <div class="row-item">📅 ${dateLabel}${m.gio ? ' · ' + m.gio : ''}</div>
        ${m.san ? `<div class="row-item">📍 ${m.san}</div>` : ''}
        ${m.mauAo ? `<div class="row-item">👕 ${m.mauAo}</div>` : ''}
      </div>
      <div class="match-going">
        <div><div class="val">${diCount}/${total}</div><div class="lbl">Người đi</div></div>
      </div>
      <div class="match-extra">
        ${liveLine}
        ${meetLine}
        ${h2hLine}
      </div>
      ${hauCanBox}
    </div>`;
}

function renderAttendanceCard(d) {
  const att = d.attendance || {};
  if (!d.nextMatch) return '';
  const groups = STATUS_ORDER.map(status => {
    const names = att[status] || [];
    const meta = STATUS_META[status];
    return `
      <div class="att-group" data-status="${status}">
        <div class="att-head" onclick="this.parentElement.classList.toggle('open')">
          <span class="lbl"><span class="${meta.dot}">${meta.icon}</span> ${status}</span>
          <span class="att-count ${meta.dot}">${names.length}</span>
          <span class="att-caret">▶</span>
        </div>
        <div class="att-names">
          ${names.length ? names.map(n => `<span class="att-chip">${n}</span>`).join('') : '<span class="att-chip">Chưa có ai</span>'}
        </div>
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-title">✅ Điểm danh</div>
      ${groups}
    </div>`;
}

function padSlot(list, count) {
  const arr = (list || []).slice(0, count);
  while (arr.length < count) arr.push(null);
  return arr;
}

function pitchPlayerHTML(p, posKey) {
  if (!p) {
    return `
      <div class="pitch-player empty ${posClass(posKey)}">
        <div class="pitch-avatar"><span class="ini">?</span></div>
        <div class="pitch-name">Chưa có</div>
        <div class="pitch-pos">${posLabel(posKey)}</div>
      </div>`;
  }
  const avatarHTML = p.avatar
    ? `<img src="${faceUrl(p.avatar, 90)}" alt="${p.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`
    : '';
  return `
    <div class="pitch-player ${posClass(p.viTri)}">
      <div class="pitch-avatar">${avatarHTML}<span class="ini" style="${p.avatar ? 'display:none' : ''}">${initials(p.name)}</span></div>
      <div class="pitch-name">${p.name}</div>
      <div class="pitch-pos">${posLabel(p.viTri)}</div>
    </div>`;
}

function pitchRowHTML(tuples) {
  return `<div class="pitch-row">${tuples.map(([p, pk]) => pitchPlayerHTML(p, pk)).join('')}</div>`;
}

function renderPitch(lineup) {
  const slots = lineup.slots || {};
  const gk  = padSlot(slots["Thủ môn"], 1);
  const hvc = padSlot(slots["Hậu vệ cánh"], 2);
  const tv  = padSlot(slots["Trung vệ"], 2);
  const ttt = padSlot(slots["Tiền vệ TT"], 3);
  const tvc = padSlot(slots["Tiền vệ cánh"], 2);
  const td  = padSlot(slots["Tiền đạo"], 1);

  const fwRow  = [[td[0],  "Tiền đạo"]];
  const mfRow  = [[tvc[0], "Tiền vệ cánh"], [ttt[1], "Tiền vệ TT"], [ttt[2], "Tiền vệ TT"], [tvc[1], "Tiền vệ cánh"]];
  const dmRow  = [[ttt[0], "Tiền vệ TT"]];
  const defRow = [[hvc[0], "Hậu vệ cánh"], [tv[0], "Trung vệ"], [tv[1], "Trung vệ"], [hvc[1], "Hậu vệ cánh"]];
  const gkRow  = [[gk[0],  "Thủ môn"]];

  return `
    <div class="pitch-field">
      <div class="pitch-goal top"></div>
      ${pitchRowHTML(fwRow)}
      ${pitchRowHTML(mfRow)}
      ${pitchRowHTML(dmRow)}
      ${pitchRowHTML(defRow)}
      ${pitchRowHTML(gkRow)}
      <div class="pitch-goal bot"></div>
    </div>`;
}

function renderLineupCard(d) {
  if (!d.nextMatch) return '';
  const going = (d.attendance && d.attendance["Tham gia"]) || [];

  if (going.length === 0) {
    return `
      <div class="card">
        <div class="card-title">🏁 Đội hình dự kiến</div>
        <div class="lineup-empty">Chưa có ai điểm danh "Tham gia" cho trận này.</div>
      </div>`;
  }

  const lineup   = d.lineup || { formation: '4-1-4-1', slots: {}, reserves: [] };
  const reserves = lineup.reserves || [];
  const reserveHTML = reserves.length ? `
      <div class="reserve-title">🔄 Dự bị (${reserves.length})</div>
      <div class="reserve-list">
        ${reserves.map(p => `
          <div class="reserve-chip">
            <div class="reserve-avatar">${p.avatar ? `<img src="${faceUrl(p.avatar, 40)}" alt="${p.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">` : ''}<span class="ini" style="${p.avatar ? 'display:none' : ''}">${initials(p.name)}</span></div>
            <span>${p.name}</span>
          </div>`).join('')}
      </div>` : '';

  return `
    <div class="card">
      <div class="card-title">🏁 Đội hình dự kiến · Sơ đồ ${lineup.formation || '4-1-4-1'}</div>
      <div class="pitch-note">Ưu tiên người điểm danh "Tham gia" sớm nhất, xếp đúng vị trí sở trường.</div>
      ${renderPitch(lineup)}
      ${reserveHTML}
      <a class="lineup-link" href="dynamic.html">📊 Xem đội hình tiêu biểu theo điểm số ›</a>
    </div>`;
}

function renderScheduleCard(d) {
  const items = d.seasonSchedule || [];
  if (!items.length) return '';

  const rows = items.map(s => {
    const dt = new Date(s.ngay + 'T00:00:00');
    const dd = isNaN(dt.getTime()) ? '--' : String(dt.getDate()).padStart(2, '0');
    const mm = isNaN(dt.getTime()) ? '--' : String(dt.getMonth() + 1).padStart(2, '0');
    if (!s.isMatch) {
      return `
        <div class="sched-item off">
          <div class="sched-date"><div class="d">${dd}</div><div class="m">Th${mm}</div></div>
          <div class="sched-info">
            <div class="sched-title">😴 Nghỉ${s.note ? ' · ' + s.note : ''}</div>
            <div class="sched-sub">${s.thu || ''}</div>
          </div>
        </div>`;
    }
    return `
      <div class="sched-item">
        <div class="sched-date"><div class="d">${dd}</div><div class="m">Th${mm}</div></div>
        <div class="sched-info">
          <div class="sched-title">vs ${s.doiThu}</div>
          <div class="sched-sub">${s.thu || ''}${s.gio ? ' · ' + s.gio : ''}${s.san ? ' · ' + s.san : ''}</div>
        </div>
        ${s.live ? `<div class="sched-live">🔴 LIVE</div>` : ''}
      </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-title">🗓️ Lịch thi đấu mùa giải</div>
      <div class="sched-list">${rows}</div>
      <a class="sched-more-link" href="schedule.html">📋 Xem toàn bộ lịch thi đấu ›</a>
    </div>`;
}

function renderFeedCard(d) {
  const results = d.recentResults || [];
  const finance = d.recentFinance || [];

  const resultItems = results.map(m => `
    <div class="feed-item">
      <div class="feed-badge ${m.result}">${m.result}</div>
      <div class="feed-text">
        <div class="feed-title">vs ${m.opponent} · ${m.our}-${m.their}</div>
        <div class="feed-sub">${m.date}</div>
      </div>
    </div>`).join('');

  const financeItems = finance.map(f => {
    const isThu = f.type === 'Thu';
    return `
    <div class="feed-item">
      <div class="feed-badge ${isThu ? 'thu' : 'chi'}">${isThu ? '＋' : '－'}</div>
      <div class="feed-text">
        <div class="feed-title">${f.category || (isThu ? 'Khoản thu' : 'Khoản chi')}</div>
        <div class="feed-sub">${f.date}</div>
      </div>
      <div class="feed-amount ${isThu ? 'pos' : 'neg'}">${isThu ? '+' : '-'}${fmt(f.amount)}đ</div>
    </div>`;
  }).join('');

  const body = (resultItems + financeItems) || `<div class="empty-note">Chưa có hoạt động nào được ghi nhận.</div>`;

  return `
    <div class="card">
      <div class="card-title">📰 Hoạt động gần đây</div>
      ${body}
    </div>`;
}

function renderDashboard(d) {
  document.getElementById('team-name').textContent = `⚽ ${d.teamName || 'LONGXUYEN FC'}`;
  document.getElementById('team-meta').textContent = `Thành lập ${d.foundedYear} · ${d.memberCount} thành viên`;

  const bdays = d.birthdaysThisMonth || [];
  if (bdays.length) {
    const banner = document.getElementById('bday-banner');
    banner.style.display = 'block';
    const items = bdays.map(b => `
      <div class="bday-item ${b.isToday ? 'is-today' : ''}">${b.isToday ? '🎉 ' : ''}<strong>${b.name}</strong> · ${b.dateLabel}${b.isToday ? ' (hôm nay!)' : ''}</div>`
    ).join('');
    banner.innerHTML = `<div class="bday-title">🎂 Sinh nhật tháng này</div><div class="bday-list">${items}</div>`;
  }

  document.getElementById('content').innerHTML =
    renderNextMatchCard(d) + renderAttendanceCard(d) + renderLineupCard(d) + renderScheduleCard(d) + renderFeedCard(d);

  document.getElementById('updated').textContent = `Cập nhật: ${d.updatedAt}`;
}

fetch(API_URL)
  .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(data => {
    // Nếu Apps Script Web App chưa được deploy lại bản mới (?page=home chưa được nhận diện),
    // doGet cũ sẽ rơi vào nhánh else và trả về dữ liệu Đội Hình (không có teamName/foundedYear...).
    if (!data || typeof data.teamName === 'undefined' || typeof data.foundedYear === 'undefined') {
      document.getElementById('team-meta').textContent = 'Cần deploy lại Apps Script';
      document.getElementById('content').innerHTML = `
        <div class="card" style="text-align:center;padding:24px">
          <div style="font-size:28px;margin-bottom:8px">🔧</div>
          <div style="font-weight:600;margin-bottom:8px">API đang trả dữ liệu cũ (chưa có route trang chủ)</div>
          <div style="color:rgba(255,255,255,0.55);font-size:12px;line-height:1.7;text-align:left;max-width:420px;margin:0 auto">
            Vào Apps Script ▸ <strong>Deploy</strong> ▸ <strong>Manage deployments</strong> ▸ bấm biểu tượng
            bút chì (✏️) trên bản deploy đang dùng ▸ mục Version chọn <strong>New version</strong> ▸ bấm
            <strong>Deploy</strong>.<br><br>
            Lưu ý: chỉnh sửa trên bản deploy hiện có (đừng tạo deployment mới) để giữ nguyên đường link API mà
            trang này đang gọi tới.
          </div>
        </div>`;
      return;
    }
    renderDashboard(data);
  })
  .catch(err => {
    document.getElementById('content').innerHTML = `
      <div class="card" style="text-align:center;padding:30px">
        <div style="font-size:28px;margin-bottom:8px">⚠️</div>
        <div>Không tải được dữ liệu</div>
        <div style="color:rgba(255,255,255,0.3);font-size:11px;margin-top:4px">${err.message}</div>
      </div>`;
    document.getElementById('team-meta').textContent = 'Lỗi kết nối';
  });
</script>
</body>
</html>
